name: Unit Test, Lint and Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: {}
  schedule:
    - cron: "1 1 2 * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  build_and_test:
    name: "Lint Test and Build"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable

      - name: Test and Build
        run: make build

      - name: Contract Tests (Docker)
        env:
          PDNS_CONTRACT: "1"
          GOFLAGS: -buildvcs=false
        run: go test -tags contract ./...

      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false # optional (default = false)
          files: reports/** # optional
          flags: unittests # optional
          name: codecov-umbrella # optional
          verbose: true # optional (default = false)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Auto-commit go mod tidy for Dependabot
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git checkout -- go.mod go.sum
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin "$HEAD_REF"
            git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
            go mod tidy
            git add go.mod go.sum
            if ! git diff --cached --quiet; then
              git commit -m "chore(deps): go mod tidy"
              git push origin "HEAD:refs/heads/$HEAD_REF"
            fi
          fi
  
  snyk-security-scan:
    name: "Snyk Security Scan"
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_API_TOKEN }}
    steps:
      - if: env.SNYK_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: env.SNYK_TOKEN != ''
        name: Snyk Security Scanning
        uses: snyk/actions/golang@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNYK_TOKEN: ${{ secrets.SNYK_API_TOKEN }}
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
