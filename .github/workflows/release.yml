name: goreleaser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: none
  artifact-metadata: none
  attestations: none
  checks: none
  deployments: none
  id-token: none
  issues: none
  models: none
  discussions: none
  packages: none
  pages: none
  pull-requests: none
  security-events: none
  statuses: none

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - 
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - 
        name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      -
        name: Install Syft
        run: go install github.com/anchore/syft/cmd/syft@latest
      - 
        name: Run GoReleaser Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_MAINTAINER: ${{ vars.GORELEASER_MAINTAINER || vars.GORELEASER_MAINTANER }}
